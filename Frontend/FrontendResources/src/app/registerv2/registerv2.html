<!-- src/app/registerv2/registerv2.html -->

<div class="auth-layout">
  <div class="auth-visual">
    <div class="auth-visual-overlay"></div>
    <div class="auth-visual-content">
      <span class="auth-brand">Uffezzi</span>
      <p class="auth-tagline">Centralizza la gestione delle risorse aziendali in un'unica piattaforma.</p>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <h1>Crea un account</h1>
      <p class="auth-subtitle">Registrati per iniziare a prenotare</p>

      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="username-input">Username</label>
          <input
            type="text"
            id="username-input"
            [(ngModel)]="userData.username"
            name="username"
            placeholder="mario.rossi"
            autocomplete="username"
            required
          >
        </div>

        <div class="row">
          <div class="field">
            <label for="firstname-input">Nome</label>
            <input
              type="text"
              id="firstname-input"
              [(ngModel)]="userData.first_name"
              name="first_name"
              placeholder="Mario"
              autocomplete="given-name"
            >
          </div>
          <div class="field">
            <label for="surname-input">Cognome</label>
            <input
              type="text"
              id="surname-input"
              [(ngModel)]="userData.last_name"
              name="last_name"
              placeholder="Rossi"
              autocomplete="family-name"
            >
          </div>
        </div>

        <div class="field">
          <label for="email-input">Email</label>
          <input
            type="email"
            id="email-input"
            [(ngModel)]="userData.email"
            name="email"
            placeholder="mario.rossi@azienda.it"
            autocomplete="email"
            required
          >
        </div>

        <div class="row">
          <div class="field">
            <label for="password-input">Password</label>
            <input
              type="password"
              id="password-input"
              [(ngModel)]="userData.password"
              name="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            >
          </div>
          <div class="field">
            <label for="repeat-password-input">Ripeti password</label>
            <input
              type="password"
              id="repeat-password-input"
              [(ngModel)]="userData.repeatPassword"
              name="repeatPassword"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            >
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="btn btn-primary auth-submit"
          [disabled]="isLoading || !userData.username || !userData.email || !userData.password || !userData.repeatPassword"
        >
          {{ isLoading ? 'Registrazione in corso...' : 'Registrati' }}
        </button>
      </form>

      <p class="auth-switch">Hai già un account? <a routerLink="/loginv2">Accedi</a></p>
    </div>
  </div>
</div>
