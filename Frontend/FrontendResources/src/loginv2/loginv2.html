<!-- src/app/loginv2/loginv2.html -->

<div class="auth-layout">
  <div class="auth-visual">
    <div class="auth-visual-overlay"></div>
    <div class="auth-visual-content">
      <span class="auth-brand">Uffezzi</span>
      <p class="auth-tagline">Prenota sale, veicoli e attrezzature aziendali in pochi click.</p>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <h1>Bentornato</h1>
      <p class="auth-subtitle">Accedi al tuo account per continuare</p>

      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="username-input">Username</label>
          <input
            type="text"
            id="username-input"
            [(ngModel)]="credentials.username"
            name="username"
            placeholder="mario.rossi"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password-input">Password</label>
          <input
            type="password"
            id="password-input"
            [(ngModel)]="credentials.password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="btn btn-primary auth-submit"
          [disabled]="isLoading || !credentials.username || !credentials.password"
        >
          {{ isLoading ? 'Accesso in corso...' : 'Accedi' }}
        </button>
      </form>

      <p class="auth-switch">Non hai un account? <a routerLink="/registerv2">Registrati</a></p>
    </div>
  </div>
</div>
