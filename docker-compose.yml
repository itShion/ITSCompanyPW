services:
  django:
    container_name: gestionale
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - secrets/secrets.txt
    volumes:
      - .:/usr/src/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_network

  angular:
    container_name: frontend_angular
    build:
      context: ./Frontend/FrontendResources
      dockerfile: Dockerfile
    volumes:
      - ./Frontend/FrontendResources:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - API_URL=http://django:8000
      - NG_CLI_ANALYTICS=false
    depends_on:
      - django
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4200/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge